<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Certificate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        
        button {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #3170c3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        button:hover {
            background-color: #1e40af;
        }
    </style>
</head>
<body>
    <button id="downloadBtn" onclick="downloadCertificate()">Course Certificate</button>
    
    <script>
        function downloadCertificate() {
            const link = document.createElement('a');
            link.href = 'Moocs_certificate.pdf';
            link.download = 'Moocs_certificate.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
